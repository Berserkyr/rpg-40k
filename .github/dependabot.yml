# Surveillance automatisée des dépendances (compétence C4.1.1).
#
# Politique appliquée :
#   - patch + mineure  -> regroupées en une seule PR par écosystème (revue rapide, faible risque) ;
#   - majeure          -> PR isolée, jamais groupée, fusion manuelle après évaluation d'impact.
#
# La cadence hebdomadaire matérialise la "veille d'obsolescence" décrite dans
# docs/bloc4/01_processus_maj_dependances.md.
version: 2

updates:
  # ---------------------------------------------------------------------------
  # Backend Python (requirements.txt)
  # ---------------------------------------------------------------------------
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels: ["dependencies", "backend"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend-mineures-et-correctifs:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ---------------------------------------------------------------------------
  # Frontend npm (frontend/package.json + package-lock.json)
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels: ["dependencies", "frontend"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Outils de build/test : hors bundle de production, risque limité au poste
      # de développement et à la CI -> regroupés largement, majeures incluses.
      frontend-outils-dev:
        dependency-type: development
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # Dépendances d'exécution (React, Three.js) : livrées à l'utilisateur.
      frontend-runtime:
        dependency-type: production
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ---------------------------------------------------------------------------
  # Images de base Docker
  # ---------------------------------------------------------------------------
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    labels: ["dependencies", "infra"]
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: docker
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    labels: ["dependencies", "infra"]
    commit-message:
      prefix: "chore(docker)"

  # ---------------------------------------------------------------------------
  # Actions tierces utilisées par la CI/CD
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-mineures-et-correctifs:
        patterns: ["*"]
        update-types: ["minor", "patch"]
